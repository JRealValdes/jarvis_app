org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Keep legacy AGP DSL types until a dedicated new-DSL migration.
android.newDsl=false
# Must be set explicitly. If absent, Flutter's migrator appends android.builtInKotlin=false
# on build, which breaks plugins that skip KGP under AGP 9 (e.g. file_picker) and rely on
# Built-in Kotlin — CI then fails with missing FilePickerPlugin.
android.builtInKotlin=true
