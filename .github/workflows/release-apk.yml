# Build a personal-sideload release APK on every push to main and attach it
# to a GitHub Release. Signing uses the debug keystore (see android/app/build.gradle.kts)
# — not Play Store upload signing. Do not store keystores or API keys in this workflow.
name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          raw="$(grep -E '^\s*version:\s*' pubspec.yaml | head -n1 | sed -E 's/^\s*version:\s*//;s/\s+$//')"
          name="${raw%%+*}"
          if [ -z "$name" ]; then
            echo "Could not parse version from pubspec.yaml" >&2
            exit 1
          fi
          # Monotonic versionCode for Android sideload updates. Offset keeps CI
          # builds above the Flutter default (1) used by untagged local builds.
          # x.y.z is NOT auto-bumped — bump pubspec when you want a new name.
          code=$((1000 + ${{ github.run_number }}))
          tag="v${name}-${code}"
          apk="jarvis_${name}-${code}.apk"
          {
            echo "name=${name}"
            echo "code=${code}"
            echo "tag=${tag}"
            echo "apk=${apk}"
            echo "raw=${raw}"
          } >> "$GITHUB_OUTPUT"
          echo "Build name=${name} code=${code} tag=${tag} apk=${apk}"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.code }}"

      - name: Stage APK asset
        run: |
          src="build/app/outputs/flutter-apk/app-release.apk"
          dest="${{ steps.version.outputs.apk }}"
          cp "$src" "$dest"
          ls -lh "$dest"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Jarvis ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          files: ${{ steps.version.outputs.apk }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Personal **sideload** APK for Jarvis.

            | Field | Value |
            |-------|-------|
            | versionName | `${{ steps.version.outputs.name }}` |
            | versionCode | `${{ steps.version.outputs.code }}` |
            | commit | `${{ github.sha }}` |

            **Signing:** debug keystore (same as local `tooling/build_apk.ps1`). Not Play Store release signing. Allow install from unknown sources on the device.

            Do not redistribute a build that embeds someone else's API key — keys are entered at runtime.
